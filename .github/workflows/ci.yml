name: CI

defaults:
  run:
    shell: bash
    working-directory: backend

permissions:
  contents: read

env:
  SECURITY__SECRET_KEY: ci-not-a-secret
  DB__USER: postgresql
  DB__PASSWORD: ci-not-a-secret
  DB__NAME: recipes
  DB__PORT: 5432
  REDIS__PASSWORD: ci-not-a-secret
  REDIS__PORT: 6379

on:
  push:
    branches: [ "master" ]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: "backend/.python-version"

      - name: Install uv and enable caching
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          version-file: backend/pyproject.toml

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Ruff checks
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: "backend/.python-version"

      - name: Install uv and enable caching
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          version-file: backend/pyproject.toml

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Mypy typechecks
        run: uv run mypy app tests --strict

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: "backend/.python-version"

      - name: Install uv and enable caching
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          version-file: backend/pyproject.toml

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest tests -q --cov

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: ${{ env.DB__USER }}
          POSTGRES_PASSWORD: ${{ env.DB__PASSWORD }}
          POSTGRES_DB: ${{ env.DB__NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -U $POSTGRES_USER -d $POSTGRES_DB -c 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: "backend/.python-version"

      - name: Install uv and enable caching
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          version-file: backend/pyproject.toml

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run alembic
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: "backend/.python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false
          version-file: backend/pyproject.toml

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command

  docker-build:
    needs: [lint, typecheck, test, migrations, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Enable BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and load
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          load: true
          tags: recipes:ci
          context: backend

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: recipes:ci
          version: v0.76.0
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan image for code scanning
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: recipes:ci
          version: v0.76.0
          skip-setup-trivy: true
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image.sarif

      - name: Upload code scanning report
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
